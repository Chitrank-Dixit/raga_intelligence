[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raga-intelligence"
version = "0.1.0"
description = "Research-driven Indian classical raga recognition and cross-genre melodic similarity intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Indian Raga Intelligence ML Research Team" }
]
dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "transformers>=4.42.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "numpy>=1.26.4,<2.2.0",
    "pandas>=2.2.2",
    "matplotlib>=3.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "requests>=2.32.0",
    "tqdm>=4.66.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/raga_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

